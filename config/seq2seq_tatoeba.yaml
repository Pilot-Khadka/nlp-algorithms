dataset:
  name: tatoeba
  language: eng_nep
  data_dir: data/dataset_tatoeba_eng_nep/
  url: "https://object.pouta.csc.fi/Tatoeba-Challenge-v2023-09-26/eng-nep.tar"

  use_cache: true
  num_workers: auto
  pin_memory: true
  prefetch_factor: 2

  # language: eng_jpn
  # data_dir: dataset/dataset_tatoeba_eng_jpn/
  # url: "https://object.pouta.csc.fi/Tatoeba-Challenge-v2023-09-26/eng-jpn.tar"


  # name: tatoeba_eng_fra
  # language: eng_fra
  # data_dir: dataset/dataset_tatoeba_eng_fra/
  # url: "https://object.pouta.csc.fi/Tatoeba-Challenge-v2023-09-26/eng-fra.tar"

  # name: tatoeba_eng_spa
  # language: eng_spa
  # data_dir: dataset/dataset_tatoeba_eng_spa/
  # url: "https://object.pouta.csc.fi/Tatoeba-Challenge-v2023-09-26/eng-spa.tar"

  # name: tatoeba_eng_deu
  # language: eng_deu
  # data_dir: dataset/dataset_tatoeba_eng_deu/


tokenizer:
  name: bpe
  vocab_size: 8192
  joint: true
  sample_size: 60000 # bpe training does not fit in memory on the full corpus

model:
  name: transformer
  num_layers: 6
  d_model: 512
  dropout: 0.1
  shared_embeddings: true

task:
  name: machine_translation
  metrics:
    - bleu
  beam_size: 5
  len_penalty: 1.2

train:
  epochs: 15
  batch_size: 64
  max_tokens: 8000
  max_padding: 128
  multi_gpu: true
  learning_rate: 1.0 # multiplier on rate()
  warmup: 4000
  keep_last: 5
  checkpoint_dir: checkpoint/tatoeba_eng_nep
